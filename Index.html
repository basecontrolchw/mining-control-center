function shiftWins(a,b,f){

function overlapWindows(intervals,windows){
  let i=0,j=0,total=0;
  while(i<intervals.length&&j<windows.length){
    const [s,e]=intervals[i],[a,b]=windows[j];
    if(e>a&&s<b)total+=Math.max(0,Math.min(e,b)-Math.max(s,a));

function kpiCalc(units){
  const t={cal:0,bd:0,bdn:0,n:0,sb:0,op:0,units:units.filter(u=>!u.ex).length,ex:units.filter(u=>u.ex).length};
  for(const u of units){t.cal+=u.cal;t.bd+=u.bd;t.bdn+=u.bdn;t.n+=u.n;t.sb+=u.sb;t.op+=u.op}
  const pc=(x,y)=>y>1e-9?Math.max(0,Math.min(100,x/y*100)):null;
  return Object.assign(t,{
    pa:pc(t.op+t.sb,t.cal),ma:pc(t.op,t.op+t.bd),ua:pc(t.op,t.op+t.sb),eu:pc(t.op,t.cal),
    mttr:t.n?t.bdn/t.n:null,mtbf:t.n?t.op/t.n:null});
}
function periodStart(){
  let d=from();if(d)return d;
  let m="";
  for(const x of S.trips){const v=sd(x);if(v&&(!m||v<m))m=v}
  for(const arr of [S.fuel,S.service,S.downs])for(const x of arr){const v=x.date?sd(x):"";if(v&&(!m||v<m))m=v}
  return m||operationalToday();
}

/* ===== Fleet Performance Report: mengikuti sumber data kendaraan, BBM, dan downtime ===== */
/* Dioptimalkan: data di-index per unit sekali jalan (bukan difilter ulang per unit),
   today() dihitung sekali, dan hasil di-cache selama data & filter tidak berubah. */
let _frCache=null;
function fleetReportData(){
  const now=new Date(),sig=per+"|"+sf+"|"+reportType+"|"+reportUnit+"|"+Math.floor(now/6e4),c=_frCache;
  if(c&&c.sig===sig&&c.v===S.vehicles&&c.t===S.trips&&c.f===S.fuel&&c.s===S.service&&c.d===S.downs&&c.l===S.delays)return c.val;
  const val=fleetReportCalc(now);
  _frCache={sig,v:S.vehicles,t:S.trips,f:S.fuel,s:S.service,d:S.downs,l:S.delays,val};
  return val;
}
function fleetReportCalc(now){
  const todayStr=operationalToday(),nowMs=+now,startStr=periodStart();
  const startMs=+new Date(startStr+"T06:00:00"); /* hari operasional mulai 06:00 (Day 06:00-17:59:59, Night 18:00-05:59:59) */
  const periodHours=Math.max(0,(nowMs-startMs)/HR);
  const WINR=shiftWins(startMs,nowMs,sf),ix=kpiIndex(nowMs);
  // Trip dihitung berdasarkan tanggal operasional shift (sdate), bukan tanggal dumping (date).
  const inRange=x=>x.date>=startStr&&x.date<=todayStr;
  const tripInRange=x=>sd(x)>=startStr&&sd(x)<=todayStr;
  const shOk=x=>sf==="all"||sh(x)===sf;
  const vehicles=vsort().filter(v=>(reportType==="all"||jn(v)===reportType)&&(reportUnit==="all"||v.id===reportUnit));
  const byUnit=new Map(),acc=id=>{let a=byUnit.get(id);if(!a)byUnit.set(id,a={rit:0,ton:0,liter:0});return a};
  for(const x of S.trips)if(tripInRange(x)&&shOk(x)){const u=acc(x.vid);u.rit++;u.ton+=Number(x.net)||0}
  for(const x of S.fuel)if(inRange(x)&&shOk(x))acc(x.vid).liter+=Number(x.liters)||0;
  // Jam Service memakai interval Service yang sudah digabung per unit, lalu dihitung
  // terhadap jendela shift sekali lintas; tidak lagi mengulang semua hari untuk tiap record.
  const serviceHours=new Map(),bdOnlyHours=new Map();
  for(const [vid,intervals] of ix.bdOnly){const h=overlapWindows(intervals,WINR);if(h>0)bdOnlyHours.set(vid,h)}
  for(const [vid,intervals] of ix.services){const h=overlapWindows(intervals,WINR);if(h>0)serviceHours.set(vid,h)}
  const PSR=per==="today"&&WINR.length?WINR[0][0]:startMs;
  const ks=vehicles.map(v=>kpiUnit(ix,v.id,startMs,nowMs,sf,WINR,PSR));
  const rows=vehicles.map((v,i)=>{
    const u=byUnit.get(v.id)||{rit:0,ton:0,liter:0},k=kpiCalc([ks[i]]);
    return {unit:un(v),jenis:jn(v),rit:u.rit,ton:u.ton,liter:u.liter,bdHours:KPI_SERVICE_AS_BD?(bdOnlyHours.get(v.id)||0):k.bd,svHours:serviceHours.get(v.id)||0,bdCount:k.n,
      sbHours:k.sb,opHours:k.op,mtbf:k.mtbf,mttr:k.mttr,pa:k.pa,ma:k.ma,ua:k.ua,eu:k.eu};
  });
  const T=kpiCalc(ks),total=key=>rows.reduce((a,x)=>a+x[key],0);
  return {startStr,endStr:todayStr,periodHours,rows,totalRit:total("rit"),totalTon:total("ton"),totalLiters:total("liter"),
    totalSched:T.cal,bdH:total("bdHours"),repH:T.bd,svH:total("svHours"),bdN:T.n,sbH:T.sb,opH:T.op,units:T.units,
    mtbf:T.mtbf,mttr:T.mttr,pa:T.pa,ma:T.ma,ua:T.ua,eu:T.eu};
}

/* Peringatan sebelum simpan delay: dobel persis ditolak; bertumpuk, bentrok BD/Service, atau > 12 jam minta konfirmasi */
async function delayCheck(recs,skipId){
const ms=(d,t)=>+new Date(d+"T"+(t||"00:00")),tv=new Map(S.trips.map(t=>[t.id,t.vid])),dup=[],warn=[];
const span=x=>(x.date===x.end?dfmt(x.date)+" "+x.time+"–"+x.etime:dfmt(x.date)+" "+x.time+" – "+dfmt(x.end)+" "+x.etime);
for(const r of recs){
const s=ms(r.date,r.time),e=ms(r.end,r.etime),u=un(vh(r.vid));
for(const x of S.delays){
if(x.id===skipId||(x.vid||tv.get(x.tripId))!==r.vid)continue;
const a=ms(x.date,x.time),b=ms(x.end,x.etime);
if(a===s&&b===e)dup.push("• "+u+": "+x.cat+", "+span(x));
else if(s<b&&e>a)warn.push("• "+u+uiT(" bertumpuk dengan Delay "," overlaps Delay ")+x.cat+", "+span(x))}
for(const x of S.downs){
if(x.vid!==r.vid)continue;
if(s<(x.end?ms(x.end,x.etime):Date.now())&&e>ms(x.date,x.time))warn.push("• "+u+uiT(" bentrok dengan "," clashes with ")+(isSvcRec(x)?"Service":"Breakdown")+" "+x.cat+", "+(x.end?span(x):dfmt(x.date)+" "+x.time+uiT(" (belum RFU)"," (not yet RFU)")))}
}
const r0=recs[0],hrs=(ms(r0.end,r0.etime)-ms(r0.date,r0.time))/36e5;
if(hrs>12)warn.push("• "+uiT("Durasi "+r2(hrs)+" jam (lebih dari 12 jam)","Duration "+r2(hrs)+" hours (more than 12)"));
const cut=a=>a.slice(0,6).join("\n")+(a.length>6?"\n"+uiT("…dan "+(a.length-6)+" lainnya","…and "+(a.length-6)+" more"):"");
if(dup.length){uiToast(uiT("Tidak disimpan. Delay yang sama persis sudah ada:","Not saved. An identical delay already exists:")+"\n"+cut(dup),"err",9000);return false}
if(warn.length)return await uiConfirm({type:"warn",icon:"alert",title:uiT("Periksa data delay","Check this delay"),msg:cut(warn),ok:uiT("Tetap simpan","Save anyway")});
return true}

AKP=(async()=>{try{const r=await api("adminList");AKD=(r&&r.ok)?r:{err:(r&&r.error)||"Failed to load user accounts"};AKDAt=Date.now()}catch(e){if(token)AKD={err:e.message||String(e)}}finally{AKP=null;if(tab==="akun")drawList()}})();
return AKP}
function akunPage(){
if(!AKD)return `<div class="card empty">Loading user accounts…</div>`;
if(AKD.err)return `<div class="card empty">${esc(AKD.err)}<br><button class="btn alt" data-ak="reload" style="margin-top:8px">Try Again</button></div>`;
const RL={admin:"ADMIN",controller:"CONTROLLER",operator:"OPERATOR"},ord={admin:0,controller:1,operator:2};
const a=AKD.accounts.filter(x=>mq(x.nama+" "+x.id+" "+x.role)).sort((x,y)=>(ord[x.role]-ord[y.role])||x.nama.localeCompare(y.nama));
const bt="padding:4px 10px;font-size:.8rem;min-height:0";
let h=`<div class="card"><h2>User Accounts (${AKD.accounts.length})</h2>`+(a.map(x=>`<div class="row"><div><b>${esc(x.nama)} <small>· ${esc(x.id)}${x.id===AKD.me?" · You":""}</small></b><small><span class="tag ${x.role==="admin"?"t-b":x.role==="controller"?"t-w":"t-n"}">${RL[x.role]||esc(x.role)}</span>${x.aktif?"":`<span class="tag t-b">Inactive</span>`}${x.lockMin>0?`<span class="tag t-w">Locked ${x.lockMin} mnt</span>`:""}${x.must?`<span class="tag t-n">Temporary PIN not changed</span>`:""}${x.role==="operator"?`<span class="tag ${x.hp?"t-n":"t-w"}">${x.hp?esc(x.hp):"Belum ada HP"}</span>`:""}</small></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-self:flex-start">${x.role==="operator"?`<button class="btn alt" style="${bt}" data-ak="hp" data-aid="${esc(x.id)}">${x.hp?"Ubah HP":"Isi HP"}</button>`:""}${x.aktif&&x.id!==AKD.me?`<button class="btn alt" style="${bt}" data-ak="reset" data-aid="${esc(x.id)}">Reset PIN</button>`:""}${(x.lockMin>0||x.fails>0)?`<button class="del" data-ak="unlock" data-aid="${esc(x.id)}">Unlock</button>`:""}${isAdmin&&x.id!==AKD.me?`<button class="del" data-ak="${x.aktif?"off":"on"}" data-aid="${esc(x.id)}">${x.aktif?"Deactivate":"Activate"}</button>`:""}</div></div>`).join("")||`<span class="empty">Tidak ada akun.</span>`)+`</div>`;
const nA=(AKD.noAcc||[]).filter(o=>{const op=S.operators.find(x=>x.id===o.id||x.name===o.nama);return !(op&&isStf(op))});
if(nA.length)h+=`<div class="card"><h2>Operators Without Accounts (${nA.length})</h2><small>${nA.slice(0,12).map(o=>esc(o.nama)).join(", ")}${nA.length>12?" …":""}</small>${isAdmin?`<button class="btn" style="margin-top:8px;width:100%" data-ak="missing">Create PINs for All</button>`:`<small style="display:block;margin-top:6px">Ask an administrator to issue a PIN.</small>`}</div>`;
const nR=AKD.accounts.filter(x=>x.role==="operator"&&x.aktif&&x.must).length;
if(isAdmin&&nR)h+=`<div class="card"><h2>Reset PIN Massal (${nR})</h2><small>Membuat PIN baru untuk operator yang belum mengganti PIN awal. Operator yang sudah punya PIN sendiri tidak diubah.</small><button class="btn" style="margin-top:8px;width:100%" data-ak="resetall">Reset PIN ${nR} operator</button></div>`;
if(isAdmin)h+=`<div class="card"><h2>Tambah controller / admin</h2><form id="stf"><label class="w">ID (3 sampai 20 huruf/angka)<input name="id" required autocapitalize="characters" autocomplete="off"></label><label class="w">Nama<input name="nama" required autocomplete="off"></label><label class="w">Peran<select name="role"><option value="controller">Controller</option><option value="admin">Admin</option></select></label><button class="btn" type="submit">Buat akun</button></form></div>`;
return h}
document.addEventListener("click",async e=>{
const pr=e.target.closest("[data-promo]");
if(pr&&isAdmin){
const o=S.operators.find(x=>x.id===pr.dataset.promo);if(!o)return;
if(!await uiConfirm({type:"primary",icon:"user",title:uiT("Jadikan Controller?","Make Controller?"),msg:uiT("Jadikan "+o.name+" ["+o.id+"] sebagai Controller? Akun dibuat dengan PIN sementara.","Make "+o.name+" ["+o.id+"] a Controller? The account is created with a temporary PIN."),ok:uiT("Ya, jadikan","Yes, promote")}))return;
pr.disabled=true;
try{const r=await api("createStaff",o.id,o.name,"controller");if(!r.ok)throw new Error(r.error);showPins([{id:r.id,nama:r.nama,pin:r.pin}],"Controller account created");akLoad(true)}
catch(x){if(token)alert("Gagal: "+(x.message||x))}
pr.disabled=false;return}
const b=e.target.closest("[data-ak]");if(!b)return;
const act=b.dataset.ak,id=b.dataset.aid;
if(act==="reload")return akLoad(true);
const x=(AKD&&AKD.accounts||[]).find(a=>a.id===id),nm=x?x.nama:id;
b.disabled=true;
try{
if(act==="reset"){if(!await uiConfirm({type:"warn",icon:"key",title:uiT("Reset PIN?","Reset PIN?"),msg:uiT("Reset PIN "+nm+"? PIN lama tidak berlaku lagi dan pengguna harus membuat PIN baru.","Reset PIN for "+nm+"? The old PIN will no longer work and the user must create a new PIN."),ok:uiT("Reset PIN","Reset PIN")}))return;const r=await api("resetPin",id);if(!r.ok)throw new Error(r.error);showPins([{id:r.id,nama:r.nama,pin:r.pin,hp:r.hp}],"New PIN",r.url)}
else if(act==="unlock"){const r=await api("unlockAcc",id);if(!r.ok)throw new Error(r.error)}
else if(act==="off"||act==="on"){if(act==="off"&&!await uiConfirm({type:"danger",icon:"user",title:uiT("Nonaktifkan akun?","Deactivate account?"),msg:uiT("Nonaktifkan akun "+nm+"? Sesi mereka langsung diakhiri.","Deactivate account "+nm+"? Their session will be revoked immediately."),ok:uiT("Nonaktifkan","Deactivate")}))return;const r=await api("setActive",id,act==="on");if(!r.ok)throw new Error(r.error)}
else if(act==="missing"){if(!await uiConfirm({type:"primary",icon:"user",title:uiT("Buat akun operator?","Create operator accounts?"),msg:uiT("Buat akun dan PIN awal untuk semua operator yang belum punya?","Create accounts and initial PINs for all operators who don't have one yet?"),ok:uiT("Buat akun","Create")}))return;const r=await api("issueMissingPins");if(!r.ok)throw new Error(r.error);if(r.list.length)showPins(r.list,"New Operator PINs",r.url);else alert("All operators already have accounts.")}
else if(act==="resetall"){if(!await uiConfirm({type:"warn",icon:"key",title:uiT("Reset semua PIN awal?","Reset all initial PINs?"),msg:uiT("Reset PIN semua operator yang belum mengganti PIN awal? PIN awal lama tidak berlaku lagi.","Reset the PIN of every operator who hasn't changed their initial PIN? The old initial PINs will stop working."),ok:uiT("Reset semua","Reset all")}))return;const r=await api("resetOperatorPins");if(!r.ok)throw new Error(r.error);if(r.list.length)showPins(r.list,"New Operator PINs",r.url);else alert("Tidak ada operator yang perlu direset.")}
else if(act==="hp"){const cur=x&&x.hp||"";const v=await uiPrompt({type:"primary",icon:"phone",title:uiT("Nomor WhatsApp","WhatsApp number"),msg:nm+" · "+uiT("Kosongkan untuk menghapus.","Leave empty to remove."),placeholder:"081234567890",value:cur,inputmode:"tel",ok:uiT("Simpan","Save")});if(v===null)return;const r=await api("setHp",id,v);if(!r.ok)throw new Error(r.error)}
}catch(x2){if(token)uiToast(String(x2.message||x2),"err")}
finally{b.disabled=false}
if(token)akLoad(true)});
document.addEventListener("submit",async e=>{
const f=e.target.closest("#stf");if(!f)return;e.preventDefault();
const b=f.querySelector(".btn");b.disabled=true;
try{const r=await api("createStaff",f.elements.id.value,f.elements.nama.value,f.elements.role.value);if(!r.ok)throw new Error(r.error);showPins([{id:r.id,nama:r.nama,pin:r.pin}],"Account created");f.reset();uiToast(uiT("Akun dibuat","Account created"),"ok")}catch(x){if(token)uiToast(String(x.message||x),"err")}
b.disabled=false;if(token)akLoad(true)});

$("lang").value=LANG;$("lang").addEventListener("change",e=>setLanguage(e.target.value));
$("changePinTop").addEventListener("click",()=>{if(ready&&user)openPin(false)});
$("logoutTop").addEventListener("click",confirmLogout);
const langObserver=new MutationObserver(records=>{for(const r of records){if(r.type==="childList"){r.addedNodes.forEach(n=>{if(n.nodeType===1)applyLanguage(n);else if(n.nodeType===3)applyLanguage(n.parentElement)})}}});
langObserver.observe(document.body,{childList:true,subtree:true});
applyLanguage();

/* ===== Tarik ke bawah untuk refresh (HP) ===== */
(function(){
const TH=70,MAXP=120;
const bar=document.createElement("div");
bar.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;justify-content:center;pointer-events:none;transform:translateY(-70px);opacity:0";
const pill=document.createElement("div");
pill.style.cssText="margin-top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.25);border-radius:22px;padding:8px 18px;font-size:.85rem;font-weight:700";
bar.appendChild(pill);document.body.appendChild(bar);
const T=(a,b)=>LANG==="id"?a:b;
let y0=0,dy=0,on=false,busyR=false;
const top=()=>(document.scrollingElement||document.documentElement).scrollTop<=0;
const blocked=t=>!!(document.querySelector(".ov")||(t&&t.closest&&t.closest("input,textarea,select,.report-table-wrap,[data-noptr]")));
const show=(p,txt,anim)=>{bar.style.transition=anim?"transform .2s,opacity .2s":"none";bar.style.transform="translateY("+(p-70)+"px)";bar.style.opacity=Math.min(1,p/40);pill.textContent=txt};
const hide=()=>{bar.style.transition="transform .2s,opacity .2s";bar.style.transform="translateY(-70px)";bar.style.opacity=0};
document.addEventListener("touchstart",e=>{if(busyR||e.touches.length!==1||!top()||blocked(e.target)){on=false;return}y0=e.touches[0].clientY;dy=0;on=true},{passive:true});
document.addEventListener("touchmove",e=>{
if(!on)return;
dy=e.touches[0].clientY-y0;
if(dy<=0||!top()){if(dy<=0){on=false;hide()}return}
const p=Math.min(MAXP,dy*0.5);
show(p,p>=TH*0.5&&dy*0.5>=TH*0.5?T("Lepas untuk refresh","Release to refresh"):T("Tarik untuk refresh","Pull to refresh"),false);
},{passive:true});
document.addEventListener("touchend",async()=>{
if(!on)return;on=false;
if(dy*0.5>=TH*0.5&&token&&ready){
busyR=true;show(46,T("Memuat data…","Refreshing…"),true);
try{await sync(true);show(46,T("Data diperbarui ✓","Updated ✓"),true)}
catch(e){show(46,T("Gagal refresh","Refresh failed"),true)}
setTimeout(()=>{hide();busyR=false},700)
}else hide()
},{passive:true});
document.addEventListener("touchcancel",()=>{on=false;hide()},{passive:true});
})();

/* ===== Mulai ===== */
(async()=>{
db=GDB;
dl={save:async({filename,data})=>{const b=new Blob([data],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}};
COLS.forEach(k=>db.collection(k).onSnapshot(sn=>{S[k]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));drawList()}));
setInterval(()=>{if(token&&ready&&!document.hidden)sync().catch(e=>console.error(e))},15000);
document.addEventListener("visibilitychange",()=>{if(token&&ready&&!document.hidden)sync().catch(()=>{})});
token=ls.get();
if(token)await boot();else showLogin("");
})();
